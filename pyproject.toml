[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vt-scanner"
version = "0.1.0"
description = "Scan files and directories against VirusTotal with hash caching."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "vt-py>=0.18",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.scripts]
vt-scanner = "vt_scanner.cli:main"

[project.urls]
Homepage = "https://github.com/barry-oc/vt-scanner"
Issues = "https://github.com/barry-oc/vt-scanner/issues"

[tool.setuptools.packages.find]
include = ["vt_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]